<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Practice Test — 20 Questions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <span class="badge">TOEIC PRACTICE</span>
        <h1>English TOEIC Quiz</h1>
        <p>แบบทดสอบภาษาอังกฤษ 20 ข้อ • 5 ตัวเลือก</p>
      </div>
      <div class="timer-box">
        <span>เวลา</span>
        <strong id="timer">20:00</strong>
      </div>
    </header>

    <section class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">ข้อ 1 / 20</span>
        <span id="scorePreview">ยังไม่ส่งคำตอบ</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </section>

    <main id="quiz"></main>

    <div class="nav">
      <button id="prevBtn" class="secondary">← ก่อนหน้า</button>
      <button id="nextBtn">ถัดไป →</button>
      <button id="submitBtn" class="submit">ส่งคำตอบ</button>
    </div>

    <section id="result" class="result hidden"></section>
  </div>
  <script src="script.js"></script>
</body>
</html>
